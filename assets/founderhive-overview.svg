<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Gill Sans MT','Trebuchet MS',sans-serif">
  <rect width="1600" height="900" fill="#0A0A0A"/>
  <!-- header -->
  <text x="80" y="88" fill="#FFFFFF" font-size="46" font-weight="bold">FounderHive</text>
  <text x="80" y="128" fill="#A8F0D8" font-size="23">A safe AI founder workforce — built and run on Claude Code</text>
  <text x="1520" y="92" text-anchor="end" fill="#5A5A6E" font-size="20">by Priya Lakshmi · AISSURED</text>
  <line x1="80" y1="150" x2="1520" y2="150" stroke="#454545" stroke-width="1.5"/>

  <!-- flow: You -> agents -> approve -->
  <!-- You -->
  <rect x="80" y="235" width="200" height="120" rx="14" fill="#454545" stroke="#A8F0D8" stroke-width="2"/>
  <text x="180" y="285" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="bold">You</text>
  <text x="180" y="315" text-anchor="middle" fill="#F5F5F5" font-size="17">the founder</text>
  <text x="180" y="340" text-anchor="middle" fill="#8a8a8a" font-size="14">ask · approve</text>

  <text x="312" y="280" fill="#A8F0D8" font-size="20">ask →</text>
  <line x1="290" y1="295" x2="400" y2="295" stroke="#A8F0D8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- agents panel -->
  <rect x="415" y="175" width="770" height="470" rx="18" fill="#111317" stroke="#454545" stroke-width="2"/>
  <text x="800" y="212" text-anchor="middle" fill="#A8F0D8" font-size="20" font-weight="bold">9 agents on Claude Code — each a markdown definition</text>
  <!-- 3x3 grid of agent chips -->
  <g font-size="16">
    <!-- row1 -->
    <g>
      <rect x="440" y="235" width="230" height="78" rx="10" fill="#0A0A0A" stroke="#5A5A6E"/>
      <text x="455" y="268" fill="#FFFFFF" font-weight="bold">Honey</text><text x="455" y="292" fill="#8a8a8a" font-size="14">Chief of Staff</text>
      <rect x="685" y="235" width="230" height="78" rx="10" fill="#0A0A0A" stroke="#5A5A6E"/>
      <text x="700" y="268" fill="#FFFFFF" font-weight="bold">Jason</text><text x="700" y="292" fill="#8a8a8a" font-size="14">GTM / sales</text>
      <rect x="930" y="235" width="230" height="78" rx="10" fill="#0A0A0A" stroke="#5A5A6E"/>
      <text x="945" y="268" fill="#FFFFFF" font-weight="bold">Dawn</text><text x="945" y="292" fill="#8a8a8a" font-size="14">Content</text>
    </g>
    <!-- row2 -->
    <g>
      <rect x="440" y="325" width="230" height="78" rx="10" fill="#0A0A0A" stroke="#5A5A6E"/>
      <text x="455" y="358" fill="#FFFFFF" font-weight="bold">Tarik</text><text x="455" y="382" fill="#8a8a8a" font-size="14">Customer Success</text>
      <rect x="685" y="325" width="230" height="78" rx="10" fill="#0A0A0A" stroke="#5A5A6E"/>
      <text x="700" y="358" fill="#FFFFFF" font-weight="bold">Deap</text><text x="700" y="382" fill="#8a8a8a" font-size="14">Product</text>
      <rect x="930" y="325" width="230" height="78" rx="10" fill="#0A0A0A" stroke="#5A5A6E"/>
      <text x="945" y="358" fill="#FFFFFF" font-weight="bold">Simon</text><text x="945" y="382" fill="#8a8a8a" font-size="14">Investor Relations</text>
    </g>
    <!-- row3 -->
    <g>
      <rect x="440" y="415" width="230" height="78" rx="10" fill="#0A0A0A" stroke="#5A5A6E"/>
      <text x="455" y="448" fill="#FFFFFF" font-weight="bold">James</text><text x="455" y="472" fill="#8a8a8a" font-size="14">CTO (agent)</text>
      <rect x="685" y="415" width="230" height="78" rx="10" fill="#0A0A0A" stroke="#5A5A6E"/>
      <text x="700" y="448" fill="#FFFFFF" font-weight="bold">Nora</text><text x="700" y="472" fill="#8a8a8a" font-size="14">People · Legal · Finance</text>
      <rect x="930" y="415" width="230" height="78" rx="10" fill="#0A0A0A" stroke="#A8F0D8" stroke-width="2"/>
      <text x="945" y="448" fill="#A8F0D8" font-weight="bold">Max</text><text x="945" y="472" fill="#A8F0D8" font-size="14">Co-Founder · challenges your idea</text>
    </g>
  </g>
  <text x="800" y="545" text-anchor="middle" fill="#F5F5F5" font-size="16">grounded in your company context · run on demand or on a schedule</text>
  <text x="800" y="572" text-anchor="middle" fill="#8a8a8a" font-size="14">market · pricing · competition · GTM · tech complexity · AI governance · ethics  (Max)</text>

  <text x="1200" y="280" fill="#A8F0D8" font-size="20">draft →</text>
  <line x1="1185" y1="295" x2="1300" y2="295" stroke="#A8F0D8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- output -->
  <rect x="1310" y="235" width="210" height="120" rx="14" fill="#454545" stroke="#A8F0D8" stroke-width="2"/>
  <text x="1415" y="282" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="bold">Word draft</text>
  <text x="1415" y="310" text-anchor="middle" fill="#F5F5F5" font-size="15">for your approval</text>
  <text x="1415" y="334" text-anchor="middle" fill="#8a8a8a" font-size="13">saved locally by default</text>

  <!-- guardrails band -->
  <text x="80" y="690" fill="#A8F0D8" font-size="22" font-weight="bold">Guardrails — safe to share with students</text>
  <g font-size="15.5" fill="#F5F5F5">
    <rect x="80" y="710" width="268" height="52" rx="26" fill="#0A0A0A" stroke="#A8F0D8"/>
    <text x="214" y="742" text-anchor="middle">✓ Emails only you — in code</text>
    <rect x="364" y="710" width="210" height="52" rx="26" fill="#0A0A0A" stroke="#A8F0D8"/>
    <text x="469" y="742" text-anchor="middle">✓ Draft-only, never acts</text>
    <rect x="590" y="710" width="190" height="52" rx="26" fill="#0A0A0A" stroke="#A8F0D8"/>
    <text x="685" y="742" text-anchor="middle">✓ No shell access</text>
    <rect x="796" y="710" width="230" height="52" rx="26" fill="#0A0A0A" stroke="#A8F0D8"/>
    <text x="911" y="742" text-anchor="middle">✓ Lawful, cited sources</text>
    <rect x="1042" y="710" width="300" height="52" rx="26" fill="#0A0A0A" stroke="#A8F0D8"/>
    <text x="1192" y="742" text-anchor="middle">✓ Default: saves locally, sends nothing</text>
  </g>

  <line x1="80" y1="820" x2="1520" y2="820" stroke="#454545" stroke-width="1.5"/>
  <text x="80" y="858" fill="#8a8a8a" font-size="17">Built with Claude Code · open-source (MIT)</text>
  <text x="1520" y="858" text-anchor="end" fill="#8a8a8a" font-size="17">github.com/priya-aissured/founderhive-starter · aissured.co.uk</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#A8F0D8"/></marker>
  </defs>
</svg>
